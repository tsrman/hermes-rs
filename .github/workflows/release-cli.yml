name: Release CLI

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: '1.95.0'

jobs:
  checks:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record the release commit
        id: source
        run: printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"
      - name: Check and test the workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo build --locked -p hermes-cli
          python3 -m unittest discover -s compat -p 'test_*.py'

  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            image: debian:trixie-slim
          - target: x86_64-unknown-linux-musl
            image: alpine:3.24.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          rustup default "$RUST_VERSION"
      - name: Install the musl C toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build and package
        env:
          TARGET: ${{ matrix.target }}
        run: bash compat/package_cli_release.sh "$TARGET" "$RUNNER_TEMP/dist"
      - name: Smoke-test the archive
        env:
          SMOKE_IMAGE: ${{ matrix.image }}
        run: |
          archives=("$RUNNER_TEMP"/dist/*.tar.gz)
          python3 -m compat.smoke_cli_release "${archives[0]}" "$SMOKE_IMAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    needs: [checks, build]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: ${{ runner.temp }}/dist/
          merge-multiple: true
      - name: Publish verified archives and confirm the download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_COMMIT: ${{ needs.checks.outputs.commit }}
        run: |
          cd "$RUNNER_TEMP/dist"
          tag="$GITHUB_REF_NAME"
          test "$(gh api "repos/$GH_REPO/commits/$tag" --jq '.sha')" = "$BUILD_COMMIT"
          assets=()
          for target in x86_64-unknown-linux-gnu x86_64-unknown-linux-musl; do
            archive="hermes-${tag#v}-$target.tar.gz"
            sha256sum --check --strict "$archive.sha256"
            assets+=("$archive" "$archive.sha256")
          done

          if release=$(gh release view "$tag" --json isDraft,body); then
            if jq -e '.isDraft' <<< "$release" >/dev/null; then
              jq -e '.body | contains("<!-- hermes-cli-release -->")' <<< "$release" >/dev/null
              gh release upload "$tag" "${assets[@]}" --clobber
              gh release edit "$tag" --draft=false
            fi
          else
            guide="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$tag/compat/README.md"
            cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          <!-- hermes-cli-release -->
          Hermes CLI for Linux x86_64. Choose the GNU package for glibc or the musl package for Alpine.

          See the [installation]($guide#установка-cli-из-github-releases),
          [profile migration]($guide#предварительная-проверка-и-миграция-профиля),
          and [rollback]($guide#контрольный-возврат-на-python) instructions.
          EOF
            gh release create "$tag" "${assets[@]}" --verify-tag --title "Hermes CLI $tag" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes
          fi

          published="$RUNNER_TEMP/published"
          gh release download "$tag" --pattern "hermes-${tag#v}-x86_64-unknown-linux-*" --dir "$published"
          for asset in "${assets[@]}"; do
            cmp "$asset" "$published/$asset"
          done
