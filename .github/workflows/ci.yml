name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  RUST_VERSION: '1.100.0'

jobs:
  cli-linux:
    name: CLI & compat (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"
      - name: Check formatting, clippy, and Rust tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: Build CLI and run Python compat suite
        run: |
          cargo build --locked -p hermes-cli
          python3 -m unittest discover -s compat -p 'test_*.py'

  cli-windows:
    name: CLI & runtime (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal --component clippy
          rustup default $env:RUST_VERSION
      - name: Check clippy and Rust tests
        shell: pwsh
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --no-fail-fast
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  gui-linux:
    name: GUI (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GPUI Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libfontconfig1-dev libfreetype6-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev
      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"
      - name: Check clippy and tests for hermes-gui
        run: |
          cargo clippy -p hermes-gui --all-targets --locked -- -D warnings
          cargo test -p hermes-gui --locked

  gui-windows:
    name: GUI (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal --component clippy
          rustup default $env:RUST_VERSION
      - name: Check clippy and tests for hermes-gui
        shell: pwsh
        run: |
          cargo clippy -p hermes-gui --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-gui --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Install cargo-audit and check Cargo.lock
        run: |
          cargo install --locked cargo-audit
          cargo audit
