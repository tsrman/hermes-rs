name: Release CLI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  terminal-regression:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Retest the unchanged binary with terminal output drained
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44889009616 --name mac-shell-debug --dir "$RUNNER_TEMP/baseline"
          chmod +x "$RUNNER_TEMP/baseline/hermes"
          HERMES_TEST_BINARY="$RUNNER_TEMP/baseline/hermes" python3 -m unittest -v compat.test_file_tools.TerminalToolTest
