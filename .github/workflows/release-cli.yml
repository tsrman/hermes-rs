name: Release CLI
on:
  workflow_dispatch:
permissions: {}
jobs:
  tty-diagnostic:
    runs-on: macos-15
    steps:
      - name: Inspect the controlling tty and kqueue from a child session
        run: |
          python3 - <<'PY'
          import fcntl, os, pty, select, subprocess, sys, termios, tty

          master, slave = pty.openpty()
          def controlling_terminal():
              os.setsid()
              fcntl.ioctl(0, termios.TIOCSCTTY, 0)

          proc = subprocess.run([sys.executable, "-c", """
          import os, select, termios
          print('stdin', os.isatty(0), os.ttyname(0), 'process group', os.getpgrp())
          for path in ('/dev/tty', os.ttyname(0)):
              fd = os.open(path, os.O_RDWR | os.O_NONBLOCK | os.O_NOCTTY)
              print(path, 'foreground group', os.tcgetpgrp(fd))
              termios.tcflush(fd, termios.TCIFLUSH)
              queue = select.kqueue()
              for flag in (select.KQ_FILTER_READ, select.KQ_FILTER_WRITE):
                  try:
                      print(path, flag, queue.control([
                          select.kevent(fd, filter=flag, flags=select.KQ_EV_ADD | select.KQ_EV_CLEAR)
                      ], 2, 0))
                  except OSError as error:
                      print(path, flag, repr(error))
              os.close(fd)
          """], stdin=slave, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
               text=True, check=True, preexec_fn=controlling_terminal)
          print(proc.stdout, proc.stderr)
          PY
