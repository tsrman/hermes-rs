[package]
name = "hermes-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
hermes-core = { path = "../hermes-core" }
dotenvy = "0.15.7"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
