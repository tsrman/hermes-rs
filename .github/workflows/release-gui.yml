name: Release GUI

on:
  push:
    tags:
      - 'gui-v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RUST_VERSION: '1.95.0'

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GPUI Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libfontconfig1-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev
      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"
      - name: Check and test hermes-gui
        working-directory: crates/hermes-gui
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

  build:
    needs: [checks]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GPUI Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libfontconfig1-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev
      - name: Set up Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          rustup default "$RUST_VERSION"
      - name: Build and package (Linux)
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --manifest-path crates/hermes-gui/Cargo.toml --release --locked --target "$TARGET"
          mkdir -p "$RUNNER_TEMP/dist"
          version="${GITHUB_REF_NAME#gui-v}"
          if [[ -z "$version" || "$version" == "$GITHUB_REF_NAME" ]]; then version="0.1.0"; fi
          archive="hsr-gui-$version-$TARGET.tar.gz"
          tar -czf "$RUNNER_TEMP/dist/$archive" -C "crates/hermes-gui/target/$TARGET/release" hsr-gui
          (cd "$RUNNER_TEMP/dist" && sha256sum "$archive" > "$archive.sha256")
      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --manifest-path crates/hermes-gui/Cargo.toml --release --locked --target $env:TARGET
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/dist" | Out-Null
          $version = if ($env:GITHUB_REF_NAME -like 'gui-v*') { $env:GITHUB_REF_NAME.Substring(5) } else { '0.1.0' }
          $archive = "hsr-gui-$version-$env:TARGET.zip"
          Compress-Archive -Path "crates/hermes-gui/target/$env:TARGET/release/hsr-gui.exe" -DestinationPath "$env:RUNNER_TEMP/dist/$archive" -Force
          $hash = (Get-FileHash "$env:RUNNER_TEMP/dist/$archive" -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "$env:RUNNER_TEMP/dist/$archive.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    needs: [build]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gui-*
          path: ${{ runner.temp }}/dist/
          merge-multiple: true
      - name: Publish GUI release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/dist"
          tag="$GITHUB_REF_NAME"
          gh release create "$tag" hsr-gui-* --verify-tag --title "Hermes GUI $tag" --generate-notes
