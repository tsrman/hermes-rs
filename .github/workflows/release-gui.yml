name: Release GUI

on:
  push:
    tags:
      - 'gui-v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RUST_VERSION: '1.100.0'

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GPUI Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libfontconfig1-dev libfreetype6-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev
      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"
      - name: Check and test hermes-gui
        working-directory: crates/hermes-gui
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

  build:
    needs: [checks]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GPUI Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libfontconfig1-dev libfreetype6-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev
      - name: Set up Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          rustup default "$RUST_VERSION"
      - name: Build and package (Linux GNU)
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build -p hermes-cli --release --locked --target "$TARGET"
          cargo build --manifest-path crates/hermes-gui/Cargo.toml --release --locked --target "$TARGET"
          ldd "crates/hermes-gui/target/$TARGET/release/hsr-gui"
          ldd "target/$TARGET/release/hsr"
          mkdir -p "$RUNNER_TEMP/dist" "$RUNNER_TEMP/stage"
          cp "crates/hermes-gui/target/$TARGET/release/hsr-gui" "$RUNNER_TEMP/stage/hsr-gui"
          cp "target/$TARGET/release/hsr" "$RUNNER_TEMP/stage/hsr"
          version="${GITHUB_REF_NAME#gui-v}"
          if [[ -z "$version" || "$version" == "$GITHUB_REF_NAME" ]]; then version="0.1.0"; fi
          archive="hsr-gui-$version-$TARGET.tar.gz"
          tar -czf "$RUNNER_TEMP/dist/$archive" -C "$RUNNER_TEMP/stage" hsr-gui hsr
          (cd "$RUNNER_TEMP/dist" && sha256sum "$archive" > "$archive.sha256")
      - name: Build and package (Windows MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS = "-C target-feature=+crt-static"
          cargo build -p hermes-cli --release --locked --target $env:TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS -ErrorAction SilentlyContinue
          cargo build --manifest-path crates/hermes-gui/Cargo.toml --release --locked --target $env:TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/dist" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/stage" | Out-Null
          Copy-Item "crates/hermes-gui/target/$env:TARGET/release/hsr-gui.exe" "$env:RUNNER_TEMP/stage/hsr-gui.exe"
          Copy-Item "target/$env:TARGET/release/hsr.exe" "$env:RUNNER_TEMP/stage/hsr.exe"
          $version = if ($env:GITHUB_REF_NAME -like 'gui-v*') { $env:GITHUB_REF_NAME.Substring(5) } else { '0.1.0' }
          $archive = "hsr-gui-$version-$env:TARGET.zip"
          Compress-Archive -Path "$env:RUNNER_TEMP/stage/hsr-gui.exe", "$env:RUNNER_TEMP/stage/hsr.exe" -DestinationPath "$env:RUNNER_TEMP/dist/$archive" -Force
          $hash = (Get-FileHash "$env:RUNNER_TEMP/dist/$archive" -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "$env:RUNNER_TEMP/dist/$archive.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  build-musl:
    needs: [checks]
    runs-on: ubuntu-24.04
    container:
      image: alpine:3.21
    steps:
      - name: Install Alpine build tools and GPUI musl dependencies
        shell: sh
        run: |
          apk add --no-cache \
            bash curl git build-base pkgconf \
            alsa-lib-dev fontconfig-dev freetype-dev \
            wayland-dev libxkbcommon-dev libxcb-dev \
            vulkan-loader-dev vulkan-headers \
            sqlite-dev openssl-dev ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust (musl)
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_VERSION"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Test, build, and package (Linux musl)
        shell: bash
        env:
          TARGET: x86_64-unknown-linux-musl
          RUSTFLAGS: '-C target-feature=-crt-static'
        run: |
          cargo test --manifest-path crates/hermes-gui/Cargo.toml --locked --target "$TARGET"
          cargo build -p hermes-cli --release --locked --target "$TARGET"
          cargo build --manifest-path crates/hermes-gui/Cargo.toml --release --locked --target "$TARGET"
          ldd "crates/hermes-gui/target/$TARGET/release/hsr-gui"
          ldd "target/$TARGET/release/hsr"
          mkdir -p "$RUNNER_TEMP/dist" "$RUNNER_TEMP/stage"
          cp "crates/hermes-gui/target/$TARGET/release/hsr-gui" "$RUNNER_TEMP/stage/hsr-gui"
          cp "target/$TARGET/release/hsr" "$RUNNER_TEMP/stage/hsr"
          version="${GITHUB_REF_NAME#gui-v}"
          if [[ -z "$version" || "$version" == "$GITHUB_REF_NAME" ]]; then version="0.1.0"; fi
          archive="hsr-gui-$version-$TARGET.tar.gz"
          tar -czf "$RUNNER_TEMP/dist/$archive" -C "$RUNNER_TEMP/stage" hsr-gui hsr
          (cd "$RUNNER_TEMP/dist" && sha256sum "$archive" > "$archive.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    needs: [build, build-musl]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gui-*
          path: ${{ runner.temp }}/dist/
          merge-multiple: true
      - name: Publish GUI release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/dist"
          cat hsr-gui-*.sha256 | sort -k2 > SHA256SUMS
          tag="$GITHUB_REF_NAME"
          gh release create "$tag" hsr-gui-* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Hermes GUI $tag" \
            --generate-notes
