[package]
name = "hermes-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
hermes-core = { path = "../hermes-core" }
dotenvy = "0.15.7"
icu_normalizer = { version = "2.2", default-features = false, features = ["compiled_data"] }
regex = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
ring = "0.17"
rusqlite = { version = "0.43", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth"] }
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"
fancy-regex = "0.20.2"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "alloc"] }
rust-stemmers = "1.2.0"
ignore = "0.4"
calamine = { version = "0.38", features = ["chrono"] }
rust_xlsxwriter = "0.104"

[target.'cfg(not(target_os = "macos"))'.dependencies]
rustpython-vm = { version = "0.6", default-features = false, features = ["compiler", "encodings", "freeze-stdlib", "gc", "importlib", "stdio"] }
rustpython-stdlib = { version = "0.6", default-features = false, features = ["compiler"] }
rustpython-pylib = { version = "0.6", features = ["freeze-stdlib"] }

[target.'cfg(windows)'.dependencies]
rustpython-host_env = { version = "0.6", features = ["ctypes"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
