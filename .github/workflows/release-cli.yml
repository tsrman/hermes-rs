name: Release CLI

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: '1.100.0'

jobs:
  verify-ci:
    name: Verify green CI on release commit
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a green CI workflow run for this commit
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 60); do
            runs=$(gh run list --repo "$GH_REPO" --workflow "CI" --commit "$COMMIT_SHA" --json status,conclusion,url)
            if jq -e 'any(.[]; .status == "completed" and .conclusion == "success")' <<< "$runs" >/dev/null; then
              echo "Green CI verified for $COMMIT_SHA"
              exit 0
            fi
            if jq -e 'any(.[]; .status != "completed")' <<< "$runs" >/dev/null; then
              echo "CI for $COMMIT_SHA is still running (attempt $attempt/60); waiting 15s..."
              sleep 15
              continue
            fi
            if jq -e 'length > 0' <<< "$runs" >/dev/null; then
              echo "::error::CI workflow for $COMMIT_SHA did not succeed: $runs"
              exit 1
            fi
            if [[ "$attempt" -le 6 ]]; then
              echo "Waiting for CI run to register for $COMMIT_SHA (attempt $attempt/6)..."
              sleep 15
              continue
            fi
            echo "::error::No CI workflow run found for release commit $COMMIT_SHA. Push main and wait for green CI before tagging."
            exit 1
          done
          echo "::error::Timed out waiting for CI workflow on $COMMIT_SHA."
          exit 1

  checks:
    needs: [verify-ci]
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record the release commit
        id: source
        run: printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"
      - name: Check and test the workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo build --locked -p hermes-cli
          python3 -m unittest discover -s compat -p 'test_*.py'

  build:
    needs: [verify-ci]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            image: debian:trixie-slim
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            image: alpine:3.24.2
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            image: debian:trixie-slim
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            image: alpine:3.24.2
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          rustup default "$RUST_VERSION"
      - name: Install the musl C toolchain
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build and package
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: python3 -m compat.package_cli_release "$TARGET" "$RUNNER_TEMP/dist"
      - name: Build and verify the Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          WINDOWS_CERT_PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          python -m compat.package_cli_release $env:TARGET "$env:RUNNER_TEMP/dist"
          $archive = Get-ChildItem "$env:RUNNER_TEMP/dist/*.zip"
          python -m compat.smoke_cli_release $archive.FullName
      - name: Smoke-test the Linux archive in a clean container
        if: runner.os == 'Linux'
        env:
          SMOKE_IMAGE: ${{ matrix.image }}
        run: |
          archives=("$RUNNER_TEMP"/dist/*.tar.gz)
          python3 -m compat.smoke_cli_release "${archives[0]}" "$SMOKE_IMAGE"
      - name: Smoke-test the macOS archive
        if: runner.os == 'macOS'
        run: |
          archives=("$RUNNER_TEMP"/dist/*.tar.gz)
          python3 -m compat.smoke_cli_release "${archives[0]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    needs: [checks, build]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: ${{ runner.temp }}/dist/
          merge-multiple: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist/hsr-*.tar.gz
            ${{ runner.temp }}/dist/hsr-*.zip
      - name: Publish verified archives and confirm the download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_COMMIT: ${{ needs.checks.outputs.commit }}
        run: |
          cd "$RUNNER_TEMP/dist"
          tag="$GITHUB_REF_NAME"
          test "$(gh api "repos/$GH_REPO/commits/$tag" --jq '.sha')" = "$BUILD_COMMIT"
          assets=()
          for target in x86_64-unknown-linux-gnu x86_64-unknown-linux-musl \
            aarch64-unknown-linux-gnu aarch64-unknown-linux-musl \
            aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            extension=tar.gz
            if [[ "$target" == *-msvc ]]; then extension=zip; fi
            archive="hsr-${tag#v}-$target.$extension"
            sha256sum --check --strict "$archive.sha256"
            assets+=("$archive" "$archive.sha256")
          done

          if release=$(gh release view "$tag" --json isDraft,body); then
            if jq -e '.isDraft' <<< "$release" >/dev/null; then
              jq -e '.body | contains("<!-- hermes-cli-release -->")' <<< "$release" >/dev/null
              gh release upload "$tag" "${assets[@]}" --clobber
              gh release edit "$tag" --draft=false
            fi
          else
            guide="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$tag/compat/README.md"
            cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          <!-- hermes-cli-release -->
          Hermes CLI for Linux x86_64 and arm64, macOS Intel and Apple Silicon, and Windows x64.
          On Linux, choose the GNU package for glibc or the musl package for Alpine.

          See the [installation]($guide#установка-cli-из-github-releases),
          [profile migration]($guide#предварительная-проверка-и-миграция-профиля),
          and [rollback]($guide#контрольный-возврат-на-python) instructions.
          EOF
            gh release create "$tag" "${assets[@]}" --verify-tag --title "Hermes CLI $tag" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes
          fi

          published="$RUNNER_TEMP/published"
          gh release download "$tag" --pattern "hsr-${tag#v}-*" --dir "$published"
          for asset in "${assets[@]}"; do
            cmp "$asset" "$published/$asset"
          done
