[package]
name = "hermes-gui"
version = "0.4.10"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "hsr-gui"
path = "src/main.rs"

[features]
default = ["wayland", "x11"]
wayland = ["gpui/wayland"]
x11 = ["gpui/x11"]

[dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "windows-manifest"] }
hermes-cli = { path = "../hermes-cli" }
hermes-runtime = { path = "../hermes-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
