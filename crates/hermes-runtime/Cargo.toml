[package]
name = "hermes-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
hermes-core = { path = "../hermes-core" }
dotenvy = "0.15.7"
icu_normalizer = { version = "2.2", default-features = false, features = ["compiled_data"] }
regex = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
ring = "0.17"
rusqlite = { version = "0.32.1", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
