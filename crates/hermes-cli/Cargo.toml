[package]
name = "hermes-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hermes"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
hermes-runtime = { path = "../hermes-runtime" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
