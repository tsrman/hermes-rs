name: Release CLI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  baseline:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check the previous macOS archive against the terminal regression
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44887099145 --name cli-aarch64-apple-darwin --dir "$RUNNER_TEMP/baseline"
          tar -xzf "$RUNNER_TEMP"/baseline/*.tar.gz -C "$RUNNER_TEMP/baseline"
          HERMES_TEST_BINARY="$RUNNER_TEMP/baseline/hermes" python3 -m unittest -v compat.test_file_tools.TerminalToolTest.test_terminal_runs_in_the_approved_directory_without_profile_environment
